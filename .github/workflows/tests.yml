name: Screener Tests

on:
  push:
    branches: [main]
    paths: ['*.py', 'pullback_config.json', 'requirements*.txt', '.github/workflows/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pullback.lock.txt
      - run: pip install -r requirements-pullback.lock.txt
      - run: python -m unittest discover -v
      - run: python synthetic_test.py
