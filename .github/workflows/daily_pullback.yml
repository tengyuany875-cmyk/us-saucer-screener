name: Daily Pullback

on:
  workflow_dispatch:
    inputs:
      force:
        description: Re-run even if the latest completed session is already published
        type: boolean
        default: false
  schedule:
    # 22:30 UTC, after the US close in both standard time and daylight time.
    - cron: "30 22 * * 1-5"

permissions:
  contents: write
  pages: write

concurrency:
  group: screener-updates-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pullback.lock.txt
      - name: Install daily dependencies
        run: pip install -r requirements-pullback.lock.txt
      - name: Check completed market session
        id: session
        env:
          FORCE: ${{ inputs.force || false }}
        run: |
          needed="$(python publish_site.py needs-update)"
          if [ "$FORCE" = "true" ]; then needed=true; fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
      - name: Run regression tests
        if: steps.session.outputs.needed == 'true'
        run: |
          python -m unittest discover -v
          python synthetic_test.py
      - name: Restore daily cache
        if: steps.session.outputs.needed == 'true'
        uses: actions/cache@v4
        with:
          path: cache/daily
          key: daily-v1-${{ runner.os }}-${{ hashFiles('pullback_config.json', 'requirements-pullback.lock.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            daily-v1-${{ runner.os }}-${{ hashFiles('pullback_config.json', 'requirements-pullback.lock.txt') }}-
      - name: Scan all ordinary shares and update independent tracking
        if: steps.session.outputs.needed == 'true'
        run: python -u pullback_app.py
      - name: Publish only current quality-passed full-universe results
        if: steps.session.outputs.needed == 'true'
        run: python publish_site.py daily --refresh-caps
      - name: Save daily public data and tracking
        if: steps.session.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/daily.html docs/recent.html data/pullback/latest.json history/pullback
          if ! git diff --cached --quiet; then
            git commit -m "Daily Pullback update"
            git pull --rebase origin main
            git push
          fi
      - name: Request GitHub Pages build
        if: steps.session.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
      - name: Retain scan diagnostics
        if: always() && steps.session.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-pullback-diagnostics
          path: |
            output/pullback/latest_success.json
            output/pullback/runs/
          retention-days: 7
