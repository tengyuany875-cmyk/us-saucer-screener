name: Weekly Screener

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full screener
        run: python app.py --mode full

      - name: Update history
        run: python history_update.py

      - name: Update GitHub Pages
        run: cp output/results.html docs/index.html

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html history/candidates.csv history/weekly_tracking.csv
          git diff --cached --quiet || git commit -m "Weekly screener update"
          git push
